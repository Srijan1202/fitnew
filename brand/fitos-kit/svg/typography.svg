<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs></defs><rect width="1600" height="1100" fill="#0A0D0B"/><text x="80" y="110" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="400" letter-spacing="8" fill="#8E978F" text-anchor="start">FITOS · TYPOGRAPHY</text><text x="80" y="190" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="3" fill="#C6F432" text-anchor="start">WORDMARK · CUSTOM GEOMETRIC CAPITALS (vector, no font needed)</text><g transform="translate(80.00 220.00) scale(1.7500)" fill="#FFFFFF"><path d="M 0.00 0.00 h 8.50 v 40.00 h -8.50 Z M 0.00 0.00 h 50.00 v 8.50 h -50.00 Z M 0.00 16.75 h 39.00 v 8.50 h -39.00 Z M 63.00 0.00 h 8.50 v 40.00 h -8.50 Z M 84.50 0.00 h 54.00 v 8.50 h -54.00 Z M 107.25 0.00 h 8.50 v 40.00 h -8.50 Z "/><path fill-rule="evenodd" d="M 164.50 0.00 H 200.50 A 13 13 0 0 1 213.50 13.00 V 27.00 A 13 13 0 0 1 200.50 40.00 H 164.50 A 13 13 0 0 1 151.50 27.00 V 13.00 A 13 13 0 0 1 164.50 0.00 Z M 164.50 8.50 H 200.50 A 4.5 4.5 0 0 1 205.00 13.00 V 27.00 A 4.5 4.5 0 0 1 200.50 31.50 H 164.50 A 4.5 4.5 0 0 1 160.00 27.00 V 13.00 A 4.5 4.5 0 0 1 164.50 8.50 Z "/><path d="M 282.50 4.25 H 238.62 A 7.88 7.88 0 0 0 238.62 20.00 H 270.38 A 7.88 7.88 0 0 1 270.38 35.75 H 226.50" fill="none" stroke="#FFFFFF" stroke-width="8.5"/></g><line x1="80" y1="350" x2="1520" y2="350" stroke="#262D27" stroke-width="2"/><text x="80" y="400" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="3" fill="#C6F432" text-anchor="start">DISPLAY &amp; HEADINGS · BAHNSCHRIFT SEMIBOLD (web: Barlow SemiBold)</text><text x="80" y="480" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="start">Discipline builds a better you</text><text x="80" y="540" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="start">H2 · Track every set, every meal</text><text x="80" y="590" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" letter-spacing="0" fill="#FFFFFF" text-anchor="start">H3 · Weekly volume per muscle</text><line x1="80" y1="640" x2="1520" y2="640" stroke="#262D27" stroke-width="2"/><text x="80" y="690" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="3" fill="#C6F432" text-anchor="start">TAGLINE · BAHNSCHRIFT REGULAR, UPPERCASE, WIDE TRACKING</text><text x="80.00" y="750.00" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="30.00" font-weight="400" letter-spacing="13.50" fill="#8E978F" text-anchor="start" xml:space="preserve">TRACK   TRAIN   FUEL   IMPROVE</text><line x1="80" y1="800" x2="1520" y2="800" stroke="#262D27" stroke-width="2"/><text x="80" y="850" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="3" fill="#C6F432" text-anchor="start">BODY · SEGOE UI (web: Inter or Barlow)</text><text x="80" y="910" font-family="'Segoe UI', Barlow, Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#D9DDD8" text-anchor="start">FITOS turns what you log into what to do next: the next set, the next meal, the next week.</text><text x="80" y="960" font-family="'Segoe UI', Barlow, Arial, sans-serif" font-size="20" font-weight="400" letter-spacing="0" fill="#8E978F" text-anchor="start">Body 20/30 · captions 14 · numbers tabular. Line height 1.5. Never below 14 px on screen.</text><text x="80" y="1040" font-family="Bahnschrift, 'Barlow', 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="2" fill="#8E978F" text-anchor="start">Scale 64 / 40 / 28 / 20 / 16 / 14   ·   Weights 300 / 400 / 600 / 700</text></svg>
