# Spec §25 — dart analyze, flutter test, build APK.
name: ci-mobile

on:
  push:
    branches: [main, 'phase-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  mobile:
    name: apps/mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to the version the suite is run with locally, so CI and the
      # developer machine analyse and test with the same SDK (audit 2026-10-20).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # Generated .g.dart/.freezed.dart files are committed so a clone builds
      # without codegen. This regenerates and fails if the checkin is stale.
      - name: Codegen is current
        run: |
          dart run build_runner build
          git diff --exit-code -- '*.g.dart' '*.freezed.dart'

      # `dart analyze` must be clean, not merely warning-free: the standing
      # quality bar in the spec requires it. riverpod_lint runs inside it as
      # an analyzer plugin (analysis_options.yaml; beta 3.9).
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: flutter test --file-reporter json:build/test-results.json

      # Job logs need a token; annotations do not. On failure, name each failed
      # test (file, line, error) as an annotation (Phase 6.7).
      - name: Name failing tests
        if: failure()
        run: python3 ../../.github/scripts/flutter_test_annotations.py build/test-results.json

      # Debug APK is enough to prove the app assembles. Release signing is set
      # up in Phase 19 with the Play Store internal track.
      - name: Build APK
        run: flutter build apk --debug
