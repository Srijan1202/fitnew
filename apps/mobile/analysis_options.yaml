include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by build_runner; not ours to lint. They ARE committed, so a
    # clone builds without codegen; ci-mobile regenerates and diffs to catch
    # a stale checkin.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - web/**

linter:
  rules:
    - always_declare_return_types
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
