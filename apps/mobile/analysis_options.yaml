include: package:flutter_lints/flutter.yaml

# Beta 3.9: riverpod_lint 3.1+ is a native analyzer plugin (the top-level
# `plugins:` key, not the deprecated `analyzer: plugins:`), so `dart analyze`
# runs it — custom_lint, which the old version needed, pinned analyzer 8 and
# held drift and Riverpod back. Same exact version as in pubspec.yaml.
plugins:
  riverpod_lint:
    version: 3.1.9
    diagnostics:
      # Five notifiers expose read-only helpers the screens use (MessDate's
      # today/canGoBack/canGoForward, EatDate.today, the coordinator's
      # cancelled ids); the custom_lint gate let them through, and rewriting
      # them is not part of an upgrade.
      avoid_public_notifier_properties: false

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated by build_runner; not ours to lint. They ARE committed, so a
    # clone builds without codegen; ci-mobile regenerates and diffs to catch
    # a stale checkin.
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - web/**

linter:
  rules:
    - always_declare_return_types
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - require_trailing_commas
