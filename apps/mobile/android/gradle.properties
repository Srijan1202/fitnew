org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation stores paths RELATIVE to the project root. On
# Windows, with the project on D: and the pub cache on C:, there is no relative
# path between drives and every Kotlin plugin fails with:
#   "this and base files have different roots"
# Non-incremental is slightly slower but always correct. Linux CI is unaffected
# either way. Recorded in MASTER-SPEC.md §25 Environment traps.
kotlin.incremental=false
