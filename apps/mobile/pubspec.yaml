name: fitos
description: FitOS — a personal fitness operating system.
publish_to: 'none'
version: 1.0.0-alpha.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

# Versions are pinned exactly, not floated (spec §7.1). Every version below was
# resolved by `flutter pub get` against Flutter 3.47.2 / Dart 3.13.2 on
# 2026-09-08 and then pinned back from pubspec.lock — none of them are guesses.
dependencies:
  flutter:
    sdk: flutter

  # State (§7.1) — Riverpod 3.x, the consolidated community default.
  flutter_riverpod: 3.0.0
  riverpod_annotation: 3.0.0

  # Routing
  go_router: 14.6.2

  # Networking — dio + interceptors for retry and auth refresh.
  dio: 5.7.0

  # Local database for offline workout logging (§33).
  drift: 2.29.0
  # 0.5.42, not 0.5.27: the plugin hardcodes its own compileSdk, and 0.5.27
  # pins `compileSdkVersion 32` while its transitive AndroidX deps
  # (androidx.fragment 1.7.1, androidx.window 1.2.0) now require 34+. That
  # fails `assembleDebug` with 20 AAR-metadata errors. 0.5.42 declares
  # compileSdk 35.
  #
  # Deliberately NOT 0.6.0+eol: that release is an intentional no-op stub for
  # apps that have migrated to package:sqlite3 3.x. drift 2.29.0 (moved from
  # 2.23.1 in Phase 5 because drift_dev 2.23 needs analyzer 6 while
  # riverpod_lint 3 and freezed 3.2 need analyzer 7 / source_gen 3) still
  # depends on sqlite3 ^2.6, so we are on 2.x and need the real 0.5.x native
  # build scripts. Taking 0.6.0 would silently drop the bundled SQLite and
  # break offline logging (§33) at runtime rather than at build time.
  # TODO: revisit as part of the sqlite3 3.x upgrade.
  sqlite3_flutter_libs: 0.5.42
  path_provider: 2.1.5
  # 1.9.1, not 1.9.0: flutter_test from the SDK requires ^1.9.1.
  path: 1.9.1

  # Storage
  shared_preferences: 2.3.5
  flutter_secure_storage: 9.2.4

  # Models — freezed models MenuResolution as a real union (§7.1).
  # freezed_annotation is 3.x because riverpod_analyzer_utils requires ^3.0.0;
  # 2.4.4 cannot co-resolve with riverpod_generator on this toolchain.
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0

  connectivity_plus: 6.1.1

  # Auth (§11) — Firebase owns credentials; the app holds only the public
  # Firebase config, never a service account (§24). Pinned from pubspec.lock.
  firebase_core: 4.15.0
  firebase_auth: 6.7.0
  google_sign_in: 7.2.0
  uuid: 4.5.3
  flutter_local_notifications: 19.4.0
  timezone: 0.10.1
  riverpod: 3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.1
  freezed: 3.2.3
  json_serializable: 6.11.2
  riverpod_generator: 3.0.0
  custom_lint: 0.8.1
  riverpod_lint: 3.0.0
  drift_dev: 2.29.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  # Re-added in Phase 1 once custom_lint 0.8.x shipped analyzer_plugin ^0.13,
  # resolving the Phase 0 conflict with riverpod_lint. Runs in CI via
  # `dart run custom_lint`, not as an analyzer plugin (legacy key deprecated).

flutter:
  uses-material-design: true

  # §6.3 — Anton for large metrics, Archivo for everything else.
  # Font binaries are not in the repo yet; until they are added here the theme
  # falls back to the platform sans-serif. Tracked as a Phase 0 known issue.
  # fonts:
  #   - family: Anton
  #     fonts:
  #       - asset: assets/fonts/Anton-Regular.ttf
  #   - family: Archivo
  #     fonts:
  #       - asset: assets/fonts/Archivo-Regular.ttf
  #       - asset: assets/fonts/Archivo-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Archivo-Bold.ttf
  #         weight: 700

# Phase 6.6 branding (owner: Claude's initial FITOS mark, iterate later).
# Sources are generated by `python tool/brand.py`; these two tools write the
# Android resources. Re-run `dart run flutter_launcher_icons` and
# `dart run flutter_native_splash:create` after changing the sources.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#EDEBE4"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  min_sdk_android: 26

flutter_native_splash:
  color: "#EDEBE4"
  image: assets/brand/splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#EDEBE4"
    image: assets/brand/splash_android12.png
