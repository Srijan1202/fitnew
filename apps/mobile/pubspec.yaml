name: fitos
description: FitOS — a personal fitness operating system.
publish_to: 'none'
version: 1.0.0-alpha.1+2

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

# Versions are pinned exactly, not floated (spec §7.1). Every version below was
# resolved by `flutter pub get` against Flutter 3.47.2 / Dart 3.13.2 on
# 2026-09-08 and then pinned back from pubspec.lock — none of them are guesses.
# Beta 3.9 (2026-10-26): the upgraded ones were resolved and pinned the same way.
dependencies:
  flutter:
    sdk: flutter

  # State (§7.1) — Riverpod 3.x, the consolidated community default.
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7

  # Routing
  go_router: 18.1.1

  # Networking — dio + interceptors for retry and auth refresh.
  dio: 5.11.1

  # Local database for offline workout logging (§33).
  drift: 2.35.3
  # Beta 3.9: drift 2.35 is on package:sqlite3 3.x, which bundles SQLite
  # through its own build hooks, so sqlite3_flutter_libs (0.6.0+eol, a stub)
  # is gone. drift 2.29 had held it at 0.5.42 because drift_dev 2.29 needed
  # analyzer 8; custom_lint was what pinned that, and it is gone too.
  path_provider: 2.1.6
  # 1.9.1, not 1.9.0: flutter_test from the SDK requires ^1.9.1.
  path: 1.9.1

  # Storage
  shared_preferences: 2.5.6
  flutter_secure_storage: 11.2.0

  # Models — freezed models MenuResolution as a real union (§7.1).
  freezed_annotation: 3.1.0
  json_annotation: 4.12.0

  connectivity_plus: 7.3.2

  # Auth (§11) — Firebase owns credentials; the app holds only the public
  # Firebase config, never a service account (§24). Pinned from pubspec.lock.
  firebase_core: 5.1.0
  firebase_auth: 7.0.1
  google_sign_in: 7.2.0
  uuid: 4.6.0
  flutter_local_notifications: 22.3.3
  timezone: 0.11.2
  riverpod: 3.4.3
  # Phase 15: FCM registration only (POST /notifications/token); the
  # reminders themselves are scheduled on the phone (ADR-021).
  firebase_messaging: 17.0.1
  # Phase 17: hand the data export (a JSON file) to the system share sheet.
  share_plus: 13.3.1
  # Phase 19 (ADR-026): crash reports, on unless the user turns them off
  # in Privacy & data (owner, 2026-10-22); no health or food data in them.
  firebase_crashlytics: 6.0.1
  # Phase 19 (E1): the app's own build number, compared with /meta/config.
  package_info_plus: 10.2.2
  # Beta 3.2 (ADR-026 amendment): "Update" opens the download page.
  url_launcher: 6.3.3
  # Beta 4.1 (U2): the downloaded APK's SHA-256 is checked before it is
  # installed. Already in the lock (a transitive dependency); now direct.
  crypto: 3.0.8
  # Beta 3.2 (ADR-029 amendment): two short, quiet chimes made for FITOS.
  audioplayers: 6.8.1
  image_picker: 1.2.4
  # Beta 3.6 (F14): the phone's model and Android version with feedback.
  device_info_plus: 13.3.0
  # Beta 3.8 (tester feedback): photos taken inside FITOS, so Android never
  # closes it while the phone's camera app is open (the official plugin).
  camera: 0.12.1
  # Beta 4.0 (ADR-038): GPS for runs (Fused Location on Android) and the map
  # (MapLibre drawing OpenFreeMap's tiles; no key, no account).
  geolocator: 14.0.1
  maplibre_gl: 0.27.1
  # Beta 4.1 (ADR-039): the voice coach, the phone's own text-to-speech (offline).
  flutter_tts: 4.2.5
  # Beta 4.1 (updates plan, U1): the Shorebird patch this build runs, shown
  # next to the version so a report names it (Dart only; no native code).
  shorebird_code_push: 2.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.15.1
  freezed: 4.0.1
  json_serializable: 6.15.2
  riverpod_generator: 4.0.9
  riverpod_lint: 3.1.9
  drift_dev: 2.35.2
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  # riverpod_lint runs as an analyzer plugin (analysis_options.yaml), inside
  # `dart analyze`; custom_lint is no longer needed (beta 3.9).

flutter:
  uses-material-design: true

  # Beta 3.2: the rest-over and session-done chimes (tool/sounds.py).
  assets:
    - assets/sounds/
    # Beta 3.2: the app icon picker's previews (tool/app_icons.py).
    - assets/brand/app_icons/

  # ADR-028 (brand kit): Barlow for all type — the free (SIL OFL,
  # assets/fonts/OFL.txt) equivalent of the kit's Bahnschrift.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700

# ADR-028 branding: the brand kit's app icon and mark (brand/).
# Sources are generated by `python tool/brand.py`; these two tools write the
# Android resources. Re-run `dart run flutter_launcher_icons` and
# `dart run flutter_native_splash:create` after changing the sources.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#0A0D0B"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  min_sdk_android: 26

flutter_native_splash:
  color: "#0A0D0B"
  image: assets/brand/splash.png
  android: true
  ios: false
  web: false
  android_12:
    color: "#0A0D0B"
    image: assets/brand/splash_android12.png
