# Local development stack (spec §25).
# Postgres 18 to match the production target. §9.1 requires 16+; Neon
# provisions 18 for new projects (verified 2026-09-20: 18.6), and local must
# match what migrations will actually run against. Bump this, ci-api.yml and
# the pg_dump client together — never one without the others.
services:
  postgres:
    image: postgres:18-alpine
    container_name: fitos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitos
      POSTGRES_PASSWORD: fitos
      POSTGRES_DB: fitos
    ports:
      - '5432:5432'
    volumes:
      # 18+ images changed the layout: mount the PARENT, not /data. The image
      # then keeps data in a major-version subdirectory so pg_upgrade --link
      # works across a mount boundary. Mounting /data as the 16 image did
      # makes 18 refuse to start. See docker-library/postgres#1259.
      - fitos-pgdata:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # The API waits on this: starting it before Postgres accepts connections
      # makes /health flap on every `compose up`.
      test: ['CMD-SHELL', 'pg_isready -U fitos -d fitos']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: fitos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 8080
      LOG_LEVEL: debug
      DATABASE_URL: postgres://fitos:fitos@postgres:5432/fitos
      # Phase 1. Both come from docker/.env (gitignored; see docker/.env.example).
      # `:?` makes compose fail with a clear message rather than letting the API
      # crash-loop on a missing FIREBASE_PROJECT_ID.
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?set FIREBASE_PROJECT_ID in docker/.env}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase/${FIREBASE_KEY_FILE:?set FIREBASE_KEY_FILE in docker/.env}
      # Phase 6.6 — FITOS AI (owner B2). Optional: absent → the API boots and
      # /v1/ai/* answers 503 "AI is not set up". Put the key in docker/.env
      # (gitignored) only; it never reaches the image, a client or a log.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-25000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
    volumes:
      # The service-account key never enters the image (.dockerignore); it is
      # mounted read-only at runtime from the gitignored .secrets/ directory.
      - ../apps/api/.secrets:/run/secrets/firebase:ro
    ports:
      - '8080:8080'

volumes:
  fitos-pgdata:
